<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Funcionário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="hold-transition login-page">
    <div class="login-box" style="width: 450px;">
        <div class="card card-warning card-outline">
            <div class="card-header text-center">
                <h3><i class="fas fa-user-edit"></i> Gerenciar: <strong>{{ func.username }}</strong></h3>
            </div>
            <form action="/processar-funcionario/{{ func.id }}" method="POST">
                <div class="card-body">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nome do Funcionário:</label>
                        <input type="text" name="username" class="form-control" value="{{ func.username }}" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-id-badge"></i> Perfil:</label>
                        <select name="perfil" class="form-control" id="perfil-edit" onchange="toggleFilial(this.value)">
                            <option value="entregador" {% if func.perfil == 'entregador' %}selected{% endif %}>Entregador</option>
                            <option value="operador"   {% if func.perfil == 'operador'   %}selected{% endif %}>Operador PDV</option>
                            <option value="gestor"     {% if func.perfil == 'gestor'     %}selected{% endif %}>Gestor</option>
                        </select>
                    </div>

                    <div class="form-group" id="filial-group">
                        <label><i class="fas fa-store"></i> Filial:</label>
                        <select name="filial_id" class="form-control">
                            <option value="">— Sem filial —</option>
                            {% for f in filiais %}
                            <option value="{{ f.id }}" {% if func.filial_id == f.id %}selected{% endif %}>
                                {{ f.nome }}{% if f.cidade %} ({{ f.cidade }}){% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-key"></i> Nova Senha:</label>
                        <input type="password" name="nova_senha" class="form-control" placeholder="Deixe em branco para manter a atual">
                        <small class="text-muted">Preencha apenas se desejar redefinir a senha.</small>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-cogs"></i> Ação:</label>
                        <select name="acao" class="form-control">
                            <option value="editar">Salvar Alterações</option>
                            <option value="excluir" class="text-danger">Excluir Cadastro</option>
                        </select>
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-warning btn-block">
                        <i class="fas fa-save"></i> Confirmar Alteração
                    </button>
                    <a href="/gestao-funcionario" class="btn btn-default btn-block">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script>
function toggleFilial(perfil) {
    document.getElementById('filial-group').style.display =
        (perfil === 'operador') ? 'block' : 'none';
}
toggleFilial(document.getElementById('perfil-edit').value);
</script>
</body>
</html>
