{% extends "base.html" %}

{% block title %}Vincular Motorista{% endblock %}

{% block page_title %}Vincular: {{ veiculo.placa }}{% endblock %}

{% block nav_veiculos %}active{% endblock %}

{% block topbar_right %}
<a href="/gestao-veiculo" class="btn btn-sm btn-outline-secondary">
    <i class="fas fa-arrow-left mr-1"></i> Voltar
</a>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-5 offset-md-3">
        <div class="card" style="border-left: 3px solid #3b82f6;">
            <div class="card-header">
                <h6 class="mb-0 font-weight-bold text-dark">
                    <i class="fas fa-link mr-2 text-primary"></i>Vincular Motorista
                </h6>
            </div>
            <form method="POST" action="/processar-vinculo/{{ veiculo.id }}">
                <div class="card-body">

                    <div class="form-group">
                        <label for="entregador_id" class="font-weight-bold small text-dark">Motorista para este veículo</label>
                        <select id="entregador_id" name="entregador_id" class="form-control">
                            <option value="">-- Ninguém (Desvincular) --</option>
                            {% for e in entregadores %}
                            <option value="{{ e.id }}" {% if veiculo.entregador_id == e.id %}selected{% endif %}>
                                {{ e.username }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <button type="submit" class="btn btn-primary font-weight-bold">
                        <i class="fas fa-check mr-1"></i> Confirmar Alteração
                    </button>
                    <a href="/gestao-veiculo" class="btn btn-outline-secondary">
                        <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
