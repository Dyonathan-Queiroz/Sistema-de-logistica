{% extends "base.html" %}

{% block title %}Editar Veículo{% endblock %}

{% block page_title %}Editar Veículo: {{ veiculo.placa }}{% endblock %}

{% block nav_veiculos %}active{% endblock %}

{% block topbar_right %}
<a href="/gestao-veiculo" class="btn btn-sm btn-outline-secondary">
    <i class="fas fa-arrow-left mr-1"></i> Voltar
</a>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card" style="border-left: 3px solid #f59e0b;">
            <div class="card-header">
                <h6 class="mb-0 font-weight-bold text-dark">
                    <i class="fas fa-truck mr-2 text-warning"></i>Editar Veículo
                </h6>
            </div>
            <form method="POST" action="/processar-veiculo/{{ veiculo.id }}">
                <div class="card-body">

                    <div class="form-group">
                        <label for="placa" class="font-weight-bold small text-dark">Placa</label>
                        <input
                            type="text"
                            id="placa"
                            name="placa"
                            class="form-control"
                            value="{{ veiculo.placa }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="modelo" class="font-weight-bold small text-dark">Modelo</label>
                        <input
                            type="text"
                            id="modelo"
                            name="modelo"
                            class="form-control"
                            value="{{ veiculo.modelo }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="tipo" class="font-weight-bold small text-dark">Tipo</label>
                        <select id="tipo" name="tipo" class="form-control">
                            <option value="Moto" {% if veiculo.tipo == 'Moto' %}selected{% endif %}>Moto</option>
                            <option value="Carro" {% if veiculo.tipo == 'Carro' %}selected{% endif %}>Carro</option>
                            <option value="Caminhão" {% if veiculo.tipo == 'Caminhão' %}selected{% endif %}>Caminhão</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="entregador_id" class="font-weight-bold small text-dark">Motorista</label>
                        <select id="entregador_id" name="entregador_id" class="form-control">
                            <option value="">Sem motorista</option>
                            {% for e in entregadores %}
                            <option value="{{ e.id }}" {% if veiculo.entregador_id == e.id %}selected{% endif %}>
                                {{ e.username }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="acao" class="font-weight-bold small text-dark">Ação</label>
                        <select id="acao" name="acao" class="form-control">
                            <option value="editar">Salvar Alterações</option>
                            <option value="excluir">Excluir Veículo</option>
                        </select>
                    </div>

                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <button type="submit" class="btn btn-warning font-weight-bold">
                        <i class="fas fa-check mr-1"></i> Confirmar
                    </button>
                    <a href="/gestao-veiculo" class="btn btn-outline-secondary">
                        <i class="fas fa-times mr-1"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
